<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2b4cf0"/>
    </linearGradient>
    <radialGradient id="vec" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#2b4cf0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2b4cf0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="#f4f1ec"/>

  <!-- header -->
  <rect width="1200" height="86" fill="url(#hdr)"/>
  <circle cx="52" cy="43" r="15" fill="#ff8a72"/>
  <text x="84" y="52" font-family="sans-serif" font-size="26" font-weight="600" fill="#ffffff">Tone Engine</text>
  <rect x="900" y="24" width="264" height="38" rx="19" fill="#ffffff" opacity="0.15"/>
  <text x="1032" y="49" text-anchor="middle" font-family="monospace" font-size="17" fill="#ffffff">&lt;500ms inference · FastAPI</text>

  <!-- tone selector -->
  <text x="48" y="150" font-family="monospace" font-size="17" fill="#6b675f">TONE PROFILES</text>
  <g font-family="sans-serif" font-size="18">
    <rect x="48" y="168" width="128" height="42" rx="21" fill="#2b4cf0"/>
    <text x="112" y="196" text-anchor="middle" fill="#ffffff">Empathetic</text>
    <rect x="188" y="168" width="100" height="42" rx="21" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
    <text x="238" y="196" text-anchor="middle" fill="#1a1a1a">Formal</text>
    <rect x="300" y="168" width="106" height="42" rx="21" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
    <text x="353" y="196" text-anchor="middle" fill="#1a1a1a">Friendly</text>
    <rect x="418" y="168" width="102" height="42" rx="21" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
    <text x="469" y="196" text-anchor="middle" fill="#1a1a1a">Concise</text>
    <rect x="532" y="168" width="112" height="42" rx="21" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
    <text x="588" y="196" text-anchor="middle" fill="#1a1a1a">Playful</text>
  </g>

  <!-- chat column -->
  <rect x="48" y="242" width="640" height="330" rx="20" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
  <rect x="84" y="278" width="420" height="60" rx="18" fill="#ece7de"/>
  <text x="112" y="316" font-family="sans-serif" font-size="19" fill="#1a1a1a">I'm really frustrated, my order failed twice!</text>
  <rect x="84" y="352" width="200" height="30" rx="15" fill="#ff5a3c" opacity="0.14"/>
  <text x="104" y="373" font-family="monospace" font-size="15" fill="#ff5a3c">emotion: frustrated ▲</text>
  <rect x="196" y="398" width="456" height="118" rx="18" fill="#2b4cf0"/>
  <text x="224" y="438" font-family="sans-serif" font-size="19" fill="#ffffff">I completely understand — that's genuinely</text>
  <text x="224" y="466" font-family="sans-serif" font-size="19" fill="#ffffff">annoying. I've flagged both attempts and</text>
  <text x="224" y="494" font-family="sans-serif" font-size="19" fill="#ffffff">here's exactly what happened…</text>
  <rect x="196" y="530" width="248" height="28" rx="14" fill="#2b4cf0" opacity="0.12"/>
  <text x="214" y="550" font-family="monospace" font-size="14" fill="#2b4cf0">tone: empathetic · memory ✓</text>

  <!-- vector space -->
  <rect x="724" y="242" width="428" height="330" rx="20" fill="#1a1a1a"/>
  <text x="756" y="288" font-family="monospace" font-size="17" fill="#8a8aa0">FAISS · 10,000+ vectors</text>
  <circle cx="938" cy="430" r="150" fill="url(#vec)"/>
  <g fill="#6a82f5" opacity="0.85">
    <circle cx="860" cy="380" r="5"/><circle cx="910" cy="350" r="4"/><circle cx="980" cy="372" r="6"/>
    <circle cx="1030" cy="410" r="4"/><circle cx="890" cy="440" r="5"/><circle cx="960" cy="470" r="4"/>
    <circle cx="1010" cy="500" r="5"/><circle cx="850" cy="500" r="4"/><circle cx="930" cy="520" r="4"/>
  </g>
  <circle cx="938" cy="430" r="9" fill="#ff5a3c"/>
  <circle cx="938" cy="430" r="18" fill="none" stroke="#ff5a3c" stroke-width="2" opacity="0.5"/>
  <line x1="938" y1="430" x2="980" y2="372" stroke="#ff8a72" stroke-width="2"/>
  <line x1="938" y1="430" x2="890" y2="440" stroke="#ff8a72" stroke-width="2"/>
  <line x1="938" y1="430" x2="960" y2="470" stroke="#ff8a72" stroke-width="2"/>
  <text x="756" y="548" font-family="monospace" font-size="16" fill="#34d399">semantic retrieval · &lt;100ms</text>

  <!-- footer metrics -->
  <g font-family="monospace">
    <rect x="48" y="608" width="256" height="140" rx="18" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
    <text x="80" y="666" font-size="38" fill="#2b4cf0">5+</text>
    <text x="80" y="702" font-size="16" fill="#6b675f">tone profiles</text>
    <rect x="332" y="608" width="256" height="140" rx="18" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
    <text x="364" y="666" font-size="38" fill="#ff5a3c">&lt;100ms</text>
    <text x="364" y="702" font-size="16" fill="#6b675f">vector retrieval</text>
    <rect x="616" y="608" width="256" height="140" rx="18" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
    <text x="648" y="666" font-size="38" fill="#1a1a1a">10k+</text>
    <text x="648" y="702" font-size="16" fill="#6b675f">memory vectors</text>
    <rect x="900" y="608" width="252" height="140" rx="18" fill="#1a1a1a"/>
    <text x="932" y="660" font-size="22" fill="#6a82f5">LangGraph</text>
    <text x="932" y="694" font-size="17" fill="#8a8aa0">FastAPI · FAISS · PG</text>
  </g>
</svg>
