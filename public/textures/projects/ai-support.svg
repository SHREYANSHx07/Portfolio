<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#2b4cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2b4cf0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2b4cf0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="#fbfaf7"/>
  <rect x="0" y="0" width="1200" height="96" fill="url(#hdr)"/>
  <circle cx="56" cy="48" r="16" fill="#ff5a3c"/>
  <rect x="88" y="36" width="240" height="22" rx="11" fill="#ffffff" opacity="0.9"/>
  <text x="1140" y="56" text-anchor="end" font-family="monospace" font-size="22" fill="#ffffff" opacity="0.8">SSE ● streaming</text>

  <!-- user bubble -->
  <rect x="640" y="140" width="480" height="72" rx="20" fill="#2b4cf0"/>
  <text x="672" y="184" font-family="sans-serif" font-size="26" fill="#ffffff">Where is my transfer to India?</text>

  <!-- bot bubble with citation -->
  <circle cx="96" cy="286" r="22" fill="#1a1a1a"/>
  <text x="96" y="294" text-anchor="middle" font-family="monospace" font-size="20" fill="#fbfaf7">AI</text>
  <rect x="136" y="240" width="620" height="150" rx="20" fill="#ece7de"/>
  <text x="168" y="284" font-family="sans-serif" font-size="24" fill="#1a1a1a">Your transfer #SCX-2841 was paid in and is</text>
  <text x="168" y="318" font-family="sans-serif" font-size="24" fill="#1a1a1a">now settling — funds typically land in 2–4 h.</text>
  <rect x="168" y="340" width="196" height="30" rx="15" fill="#2b4cf0" opacity="0.12"/>
  <text x="184" y="362" font-family="monospace" font-size="18" fill="#2b4cf0">⛁ live API · KYC ✓</text>

  <!-- tool call trace -->
  <rect x="136" y="414" width="430" height="40" rx="12" fill="#1a1a1a"/>
  <text x="156" y="440" font-family="monospace" font-size="19" fill="#7cf29c">→ tool: get_transfer_status(user_jwt)</text>

  <!-- RAG sources -->
  <rect x="136" y="478" width="300" height="36" rx="18" fill="#ff5a3c" opacity="0.14"/>
  <text x="156" y="503" font-family="monospace" font-size="18" fill="#ff5a3c">sources: kb/settlements.md</text>

  <!-- pipeline diagram -->
  <g font-family="monospace" font-size="18" fill="#6b675f">
    <circle cx="140" cy="600" r="34" fill="url(#glow)"/>
    <circle cx="140" cy="600" r="26" fill="none" stroke="#2b4cf0" stroke-width="2.5"/>
    <text x="140" y="606" text-anchor="middle" fill="#2b4cf0">intent</text>
    <line x1="176" y1="600" x2="266" y2="600" stroke="#c9c3b8" stroke-width="2.5"/>
    <circle cx="306" cy="600" r="26" fill="none" stroke="#ff5a3c" stroke-width="2.5"/>
    <text x="306" y="606" text-anchor="middle" fill="#ff5a3c">RAG</text>
    <line x1="342" y1="600" x2="432" y2="600" stroke="#c9c3b8" stroke-width="2.5"/>
    <circle cx="472" cy="600" r="26" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
    <text x="472" y="606" text-anchor="middle" fill="#1a1a1a">tools</text>
    <line x1="508" y1="600" x2="598" y2="600" stroke="#c9c3b8" stroke-width="2.5"/>
    <circle cx="638" cy="600" r="26" fill="none" stroke="#2b4cf0" stroke-width="2.5"/>
    <text x="638" y="606" text-anchor="middle" fill="#2b4cf0">answer</text>
    <line x1="674" y1="600" x2="764" y2="600" stroke="#c9c3b8" stroke-width="2.5"/>
    <circle cx="804" cy="600" r="26" fill="none" stroke="#ff5a3c" stroke-width="2.5"/>
    <text x="804" y="604" text-anchor="middle" fill="#ff5a3c">escalate</text>
    <text x="804" y="656" text-anchor="middle" font-size="15" fill="#6b675f">confidence-scored</text>
  </g>

  <!-- input bar -->
  <rect x="80" y="700" width="1040" height="60" rx="30" fill="#ffffff" stroke="#e4dfd6" stroke-width="2"/>
  <text x="116" y="738" font-family="sans-serif" font-size="22" fill="#6b675f">Ask about transfers, KYC, payouts…</text>
  <circle cx="1080" cy="730" r="22" fill="#2b4cf0"/>
  <text x="1080" y="738" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#ffffff">↑</text>
</svg>
